<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScanBite — App Icon & Favicon</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #F5F0E8; color: #1A1A1A; padding: 48px; }
  h1 { font-size: 32px; font-weight: 700; margin-bottom: 6px; }
  h1 span { color: #E84B1A; }
  .subtitle { font-size: 15px; color: #666; font-weight: 300; margin-bottom: 48px; }
  .section { margin-bottom: 48px; }
  .section-label { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #888; margin-bottom: 20px; font-family: 'DM Mono', monospace; }
  .icons-row { display: flex; gap: 32px; align-items: flex-end; flex-wrap: wrap; }
  .icon-item { text-align: center; }
  .icon-bg { background: #E8E4DC; border-radius: 16px; padding: 24px; display: inline-flex; align-items: center; justify-content: center; }
  .icon-label { font-size: 12px; color: #888; margin-top: 10px; }
  .icon-size { font-size: 11px; color: #aaa; margin-top: 3px; font-family: 'DM Mono', monospace; }
  .favicons-row { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
  .tab-preview { background: #1A1A1A; border-radius: 8px 8px 0 0; padding: 10px 16px; display: inline-flex; align-items: center; gap: 8px; }
  .tab-label { font-size: 13px; font-weight: 500; color: #FFFFFF; }
  .ios-grid { display: grid; grid-template-columns: repeat(4, 90px); gap: 20px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); padding: 32px; border-radius: 16px; }
  .ios-app { text-align: center; }
  .ios-app p { font-size: 11px; color: rgba(255,255,255,0.8); margin-top: 6px; }
  .ios-placeholder { width: 76px; height: 76px; border-radius: 17px; background: rgba(255,255,255,0.1); }
</style>
</head>
<body>

<h1>Scan<span>Bite</span> — App Icon & Favicon</h1>
<p class="subtitle">Icon system across all sizes and contexts</p>



<div class="section">
  <div class="section-label">Favicon</div>
  <div class="favicons-row">
    <div class="icon-item">
      <div class="icon-bg">
        <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="6" fill="#E84B1A"/>
          <rect x="5" y="5" width="9" height="9" rx="2" fill="#FFFFFF"/>
          <rect x="7" y="7" width="4" height="4" rx="0.5" fill="#E84B1A"/>
          <rect x="5" y="18" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="10" y="18" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="5" y="23" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="10" y="23" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="18" y="5" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="23" y="5" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="18" y="10" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="18" y="15" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="23" y="15" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="18" y="20" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="23" y="20" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="18" y="25" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
        </svg>
      </div>
      <div class="icon-label">favicon.ico</div>
      <div class="icon-size">32 × 32</div>
    </div>
    <div class="icon-item">
      <div class="icon-bg">
        <svg width="16" height="16" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="6" fill="#E84B1A"/>
          <rect x="5" y="5" width="9" height="9" rx="2" fill="#FFFFFF"/>
          <rect x="7" y="7" width="4" height="4" rx="0.5" fill="#E84B1A"/>
          <rect x="5" y="18" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="10" y="18" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="18" y="5" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="23" y="5" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="18" y="15" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="18" y="20" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
          <rect x="18" y="25" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
        </svg>
      </div>
      <div class="icon-label">Browser tab</div>
      <div class="icon-size">16 × 16</div>
    </div>
    <div class="icon-item">
      <div class="tab-preview">
        <svg width="16" height="16" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#E84B1A"/><rect x="5" y="5" width="9" height="9" rx="2" fill="#FFFFFF"/><rect x="7" y="7" width="4" height="4" rx="0.5" fill="#E84B1A"/><rect x="5" y="18" width="4" height="4" rx="0.5" fill="#FFFFFF"/><rect x="10" y="18" width="4" height="4" rx="0.5" fill="#FFFFFF"/><rect x="18" y="5" width="4" height="4" rx="0.5" fill="#FFFFFF"/><rect x="18" y="15" width="4" height="4" rx="0.5" fill="#FFFFFF"/><rect x="18" y="25" width="4" height="4" rx="0.5" fill="#FFFFFF"/></svg>
        <span class="tab-label">ScanBite</span>
      </div>
      <div class="icon-label">Browser tab preview</div>
    </div>
  </div>
</div>



</body>
</html>
